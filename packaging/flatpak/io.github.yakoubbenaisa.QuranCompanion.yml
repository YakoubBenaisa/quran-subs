# Flatpak manifest (for Flathub). Build locally:
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/io.github.yakoubbenaisa.QuranCompanion.yml
# python3-deps.json is generated by packaging/flatpak/generate-deps.sh (flatpak-pip-generator).
id: io.github.yakoubbenaisa.QuranCompanion
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp          # PySide6 built for the KDE runtime (Flathub)
base-version: '6.9'
command: quran-companion
finish-args:
  - --share=ipc
  - --share=network                 # Quran text, recitations, links
  - --socket=x11                    # the verses use XWayland: always on top + click-through on GNOME
  - --socket=pulseaudio             # play recitations; listen to the speakers' output to follow a browser video
  - --device=dri
  - --filesystem=xdg-music:ro       # choose your own recitation files
  - --filesystem=xdg-download:ro
  - --talk-name=org.mpris.MediaPlayer2.*    # what Firefox / Chrome are playing
  - --env=QOV_PLAYER=qt
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - python3-deps.json               # numpy, yt-dlp, jeepney

  - name: ffmpeg                    # the ffmpeg command line, to read audio for syncing (decoders only)
    config-opts:
      - --disable-programs
      - --enable-ffmpeg
      - --disable-doc
      - --disable-encoders
      - --enable-encoder=pcm_s16le
      - --disable-muxers
      - --enable-muxer=pcm_s16le
      - --disable-network
      - --enable-gpl
      - --disable-static
      - --enable-shared
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
        sha256: SET-BY-generate-deps.sh
        x-checker-data:
          type: anitya
          project-id: 5405
          url-template: https://ffmpeg.org/releases/ffmpeg-$version.tar.xz

  - name: quran-companion
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 packaging/linux/io.github.yakoubbenaisa.QuranCompanion.desktop -t /app/share/applications
      - install -Dm644 packaging/linux/io.github.yakoubbenaisa.QuranCompanion.metainfo.xml -t /app/share/metainfo
      - install -Dm644 quran_companion/resources/icons/logo.png /app/share/icons/hicolor/512x512/apps/io.github.yakoubbenaisa.QuranCompanion.png
    sources:
      - type: dir                   # for Flathub: type: git, url + tag + commit of the release
        path: ../..
