[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-companion"
version = "5.0.0"
description = "Quran verses on screen while you work: recite, memorize, follow along."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff", "mypy"]

[project.scripts]
quran-companion = "quran_companion.__main__:main"

[tool.setuptools.packages.find]
include = ["quran_companion*"]

[tool.setuptools.package-data]
quran_companion = ["resources/lang/*.json", "resources/fonts/*", "resources/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E701", "E702", "E741"]   # compact one-line branches are used deliberately in UI building code

[tool.ruff.lint.per-file-ignores]
"quran_companion/settings_ui/theme/*.py" = ["E501"]   # SVG and stylesheet data

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["quran_companion/core", "quran_companion/layout", "quran_companion/playback", "quran_companion/ipc", "quran_companion/data"]
