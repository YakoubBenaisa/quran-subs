name: Release
# Push a tag like v5.0.0: builds Windows, macOS (Apple Silicon + Intel) and Linux, then publishes a
# GitHub release with all files. The landing page links to releases/latest/download/<file>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-15            # Apple Silicon
          - os: macos-15-intel      # Intel
          - os: ubuntu-22.04        # older glibc: the AppImage runs on more distributions
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"        # read sources as UTF-8 on Windows too
      SIGN_MAC: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -r packaging/requirements-build.txt
      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfuse2 desktop-file-utils
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool && echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
      - name: macOS signing certificate
        if: runner.os == 'macOS' && env.SIGN_MAC == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain && security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          echo "MACOS_SIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
      - run: python packaging/build.py
      - name: Notarize (macOS, when signed)
        if: runner.os == 'macOS' && env.SIGN_MAC == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for f in dist/*.dmg; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Stable file names for the landing page's download links
        run: |
          cd files
          for f in QuranCompanion-*; do
            n=$(echo "$f" | sed -E 's/^QuranCompanion-[0-9.]+-/QuranCompanion-/')
            cp "$f" "$n"
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
